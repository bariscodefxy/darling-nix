name: "Build and upload Darling"

on:
  push:
    paths:
      - flake.nix
      - flake.lock
      - 'overlays/**'
      - 'packages/**'

jobs:
  build:
    name: Build Darling
    runs-on: ubuntu-latest
    environment: Cachix
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Nix
        uses: cachix/install-nix-action@v20
      - name: Set up Cachix access
        uses: cachix/cachix-action@v12
        with:
          name: baris-darling
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: "(-source|-man)$"
      - name: Build Darling output
        run: |
          # All outputs: out (runtime) and sdk (macOS SDK for cross-builds).
          # Plain .#darling builds out only.
          nix build '.#darling^*'
          OUT=$(nix eval --raw .#darling)
          SDK=$(nix build '.#darling^sdk' --print-out-paths --no-link)
          cachix push baris-darling "$OUT" "$SDK"
          cachix pin baris-darling darling "$OUT" --keep-forever
          cachix pin baris-darling darling-sdk "$SDK" --keep-forever
